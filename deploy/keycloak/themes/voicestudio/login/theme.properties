# XELTO fork: Keycloak sign-in pages in VoiceStudio's default dark theme.
# Built on keycloak.v2 (Keycloak 26.4); only CSS on top, no .ftl templates.
# Colours mirror the dark block of electron/src/renderer/src/styles/t3-theme.css.
parent=keycloak.v2
import=common/keycloak

# `styles` replaces the parent's list: keep keycloak.v2's own sheet first.
styles=css/styles.css css/voicestudio.css

# Always dark, like the app in multi-user mode (xelto/theme-lock.tsx):
# no light/dark switch script, PatternFly's dark tokens on <html> from the start.
darkMode=false
kcHtmlClass=login-pf pf-v5-theme-dark
